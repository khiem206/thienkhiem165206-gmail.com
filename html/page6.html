<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming Store</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron',sans-serif;
    background:#0f172a;
    color:white;
}

/* HEADER */

header{
    background:#111827;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#60a5fa;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:#60a5fa;
}

/* SEARCH */

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    outline:none;
    width:250px;
}

.search-box button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

/* BANNER */

.banner{
    height:400px;
    background:
    linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1470&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.banner h1{
    font-size:60px;
    margin-bottom:20px;
}

.banner p{
    font-size:18px;
    color:#cbd5e1;
}

/* PRODUCTS */

.products{
    padding:60px 40px;
}

.products-title{
    font-size:35px;
    margin-bottom:40px;
    text-align:center;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

/* CARD */

.card{
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    transition:.4s;
    border:1px solid rgba(255,255,255,.05);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 10px 30px rgba(59,130,246,.3);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:#60a5fa;
    font-size:24px;
    font-weight:700;
    margin:15px 0;
}

.card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.card button:hover{
    background:#2563eb;
}

/* FOOTER */

footer{
    background:#111827;
    text-align:center;
    padding:30px;
    margin-top:40px;
    color:#94a3b8;
}

/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:20px;
    }

    .banner h1{
        font-size:40px;
    }

    .search-box input{
        width:180px;
    }
}

</style>
</head>

<body>

<header>

<div class="logo">⚡ KHIÊM MOBILE </div>

<nav>
    <a href="#">Trang Chủ</a>
    <a href="#">Laptop</a>
    <a href="#">PC Gaming</a>
    <a href="#">Phụ Kiện</a>
    <a href="#">Liên Hệ</a>
</nav>

<div class="search-box">
    <input type="text" placeholder="Tìm sản phẩm...">
    <button>Tìm</button>
</div>

</header>

<section class="banner">
    <h1>GEAR GAMING</h1>
    <p>Hiệu năng mạnh mẽ cho game thủ</p>
</section>

<section class="products">

<h2 class="products-title">SẢN PHẨM NỔI BẬT</h2>

<div class="product-grid">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=1470&auto=format&fit=crop">
        <div class="card-content">
            <h3>Tai nghe Gaming</h3>
            <div class="price">499.000đ</div>
            <button>Mua Ngay</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1527814050087-3793815479db?q=80&w=1470&auto=format&fit=crop">
        <div class="card-content">
            <h3>Bàn phím RGB</h3>
            <div class="price">899.000đ</div>
            <button>Mua Ngay</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1613141412501-9012977f1969?q=80&w=1470&auto=format&fit=crop">
        <div class="card-content">
            <h3>Chuột Gaming</h3>
            <div class="price">399.000đ</div>
            <button>Mua Ngay</button>
        </div>
    </div>

</div>

</section>

<footer>
    © 2026 Gaming Store | Designed by You
</footer>

</body>
</html>
